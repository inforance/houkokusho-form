<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>国際線の見積り依頼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{--brand:#0E6B4C;--brand-lt:#E4F1EA;--ink:#1B2320;--dim:#8A9790;
        --line:#E4E9E5;--bg:#F7F8F6;--white:#fff;--warn:#B26B5E}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
  header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 18px}
  header h1{font-size:17px;font-weight:700}
  header p{font-size:12px;color:var(--dim);margin-top:2px}
  main{padding:14px 16px}
  .msg{margin:18px;padding:14px;border-radius:10px;background:#FBEDE9;color:#8C4A3C;font-size:13.5px}
  .msg.ok{background:var(--brand-lt);color:var(--brand)}
  /* 送信後の表示：送信ボタンの場所に出す（PCなど、画面を自動で閉じられないとき） */
  .sent-box{display:flex;gap:12px;align-items:center;background:var(--brand-lt);border:1px solid #CFE3D7;
            border-radius:12px;padding:16px;margin-top:12px}
  .sent-ck{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;
           align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none}
  .sent-box b{display:block;font-size:16px;color:var(--brand);line-height:1.4}
  .sent-box p{font-size:13.5px;font-weight:700;color:#2F5A49;margin:0}
  body.sent main{pointer-events:none}
  .hide{display:none !important}

  .box{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .fl{display:block;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.03em}
  .sec{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:16px 2px 7px;letter-spacing:.03em}

  input[type=text],input[type=date],select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:16px;min-height:40px;
    font-family:inherit;color:var(--ink);background:var(--white);line-height:1.6;-webkit-appearance:none;appearance:none}
  input::placeholder{color:#AEB8B1}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-2px}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  select.empty,input[type=date].empty{color:#AEB8B1}

  /* 見出し｜入力｜＋追加 の横1行 */
  .hrow{display:flex;align-items:flex-start;gap:8px}
  .hrow+.hrow{margin-top:8px}
  .hrow>.fl{flex:none;width:4.6em;padding-top:11px}
  .hlist{flex:1;min-width:0}
  .who{display:flex;gap:7px;align-items:center;margin-bottom:5px}
  .who:last-child{margin-bottom:0}
  .who input{flex:1;min-width:0}
  .who .x{flex:none;border:none;background:none;color:var(--warn);font-size:18px;line-height:1;font-family:inherit;cursor:pointer;padding:4px 6px}
  .add{flex:none;border:none;background:none;color:var(--brand);font-size:12.5px;font-weight:700;font-family:inherit;padding:10px 0 0;cursor:pointer;white-space:nowrap}

  /* 便1区間 */
  .leg{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .leg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .leg-h b{font-size:13px;color:var(--brand)}
  .leg-h button{background:none;border:none;color:var(--warn);font-size:12px;font-family:inherit;cursor:pointer;padding:2px 4px}
  .duo{display:flex;gap:9px}
  .duo>div{flex:1;min-width:0}
  .duo .fl{margin:0 0 4px}
  .leg .row2{margin-top:8px}
  .addleg{width:100%;border:1.5px dashed #BFD8CB;color:var(--brand);border-radius:11px;padding:11px;
          text-align:center;font-size:14px;font-weight:700;background:var(--white);font-family:inherit;cursor:pointer}
  .rt{width:100%;margin-top:8px;border:1.5px solid var(--brand);background:var(--white);color:var(--brand);
      border-radius:10px;padding:7px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}

  .submit{width:100%;background:var(--brand);color:#fff;border:none;border-radius:11px;
          padding:15px;font-size:16px;font-weight:700;font-family:inherit;margin-top:18px;cursor:pointer}
  .submit:disabled{background:#A9BFB4}
  .err{color:var(--warn);font-size:13px;margin-top:12px;text-align:center;min-height:1em}
  .bad{outline:2px solid var(--warn) !important;outline-offset:-2px}

  /* 日付を選ぶボタン（タップでカレンダー） */
  .dfield{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 28px 7px 12px;min-height:40px;
          font-size:16px;font-family:inherit;color:var(--ink);background:var(--white);text-align:left;line-height:1.6;
          cursor:pointer;position:relative;display:block;white-space:nowrap;overflow:hidden}
  .dfield.empty{color:#AEB8B1}
  .dfield:after{content:'';position:absolute;right:11px;top:50%;width:13px;height:13px;margin-top:-8px;border:1.6px solid var(--dim);border-radius:2px}
  .dfield:before{content:'';position:absolute;right:13px;top:50%;width:9px;height:1.6px;margin-top:-4px;background:var(--dim);z-index:1}

  /* カレンダー */
  .sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet-in{background:var(--white);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-h b{font-size:15px}
  .cal-h button{border:none;background:var(--brand-lt);color:var(--brand);width:38px;height:38px;border-radius:19px;font-size:20px;line-height:1;font-family:inherit;cursor:pointer}
  .cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-w span{text-align:center;font-size:11px;color:var(--dim);padding-bottom:4px}
  .cal-w span:first-child{color:#C4726A}
  .cal-w span:last-child{color:#6A86C4}
  .cd{height:42px;display:flex;align-items:center;justify-content:center;font-size:14.5px;cursor:pointer;border-radius:21px;margin:1px 2px}
  .cd.empty{cursor:default}
  .cd.past{color:#C9D1CC}
  .cd.on{background:var(--brand);color:#fff;font-weight:700}
  .cal-sel{text-align:center;font-size:13px;color:var(--dim);margin:12px 0 10px;min-height:22px}
  .cal-sel b{color:var(--ink);font-size:14.5px}
  .cal-btns{display:flex;gap:9px}
  .cal-btns button{flex:1;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  #cal_cancel{background:#EEF1EF;color:#56655C}
  #cal_ok{background:var(--brand);color:#fff}
  #cal_ok:disabled{background:#A9BFB4}
  .hint{font-size:11.5px;color:var(--dim);margin-top:9px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>国際線の見積り依頼</h1>
    <p>税務顧問割引プラン、プレミアプランの方は無料でご利用いただけます。スタンダードプランの方は、1件あたり3,500円でご利用いただけます。</p>
  </header>
  <div class="msg hide" id="msg"></div>

  <main class="hide" id="form">
    <div class="box" id="people">
      <div class="hrow">
        <span class="fl">会社名</span>
        <div class="hlist" id="cos"></div>
      </div>
      <div class="hrow">
        <span class="fl">出張者</span>
        <div class="hlist" id="pes"></div>
      </div>
    </div>

    <span class="sec">便</span>
    <div id="legs"></div>
    <button type="button" class="addleg" id="addleg">＋ 便を追加</button>

    <div class="err" id="err"></div>
    <button type="button" class="submit" id="send">依頼を送る</button>
    <div class="hint">送信すると、LINEで受付のお知らせが届きます。</div>
  </main>
</div>

<template id="tpl_leg">
  <div class="leg">
    <div class="leg-h"><b class="no"></b><button type="button" class="del">削除</button></div>
    <div class="duo">
      <div><span class="fl">搭乗日</span><button type="button" class="dfield day empty">日付を選ぶ</button></div>
      <div><span class="fl">便名</span><input type="text" class="flt" placeholder="JL079" autocomplete="off" autocapitalize="characters"></div>
    </div>
    <div class="duo row2">
      <div><span class="fl">出発地</span><input type="text" class="from" placeholder="羽田" autocomplete="off"></div>
      <div><span class="fl">到着地</span><input type="text" class="to" placeholder="ホーチミン" autocomplete="off"></div>
    </div>
    <div class="row2"><span class="fl" style="margin-bottom:4px">座席クラス</span>
      <select class="cls empty">
        <option value="">座席クラスを選ぶ</option>
        <option>エコノミー</option>
        <option>プレミアムエコノミー</option>
        <option>ビジネス</option>
        <option>ファースト</option>
      </select>
    </div>
  </div>
</template>

<!-- カレンダー -->
<div class="sheet hide" id="cal">
  <div class="sheet-in">
    <div class="cal-h">
      <button type="button" id="cal_prev">‹</button>
      <b id="cal_title"></b>
      <button type="button" id="cal_next">›</button>
    </div>
    <div class="cal-w"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="cal-g" id="cal_g"></div>
    <div class="cal-sel" id="cal_sel"></div>
    <div class="cal-btns">
      <button type="button" id="cal_cancel">やめる</button>
      <button type="button" id="cal_ok">決定</button>
    </div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011518319-ABM6yIOM';
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxs0WXzhbnHdfmlzjYGmGBqtN4SPxKATK18uD8O4lhX9lL9FuJ3paP775mjoQwfwDJO/exec';
  var PREVIEW = /[?&]preview=1/.test(location.search);   // PCでの見た目確認用（送信しない）
  var IN_LINE = false;
  var myName = '';
  var $ = function (id) { return document.getElementById(id); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var val = function (s) { return String(s == null ? '' : s).trim(); };
  var MARU = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

  /* 送信できたら、押した送信ボタンの場所に「送信しました／このタブを閉じてください」を出す。
     PCのブラウザでは画面を自動で閉じられず、上に出す案内だと下にいる人が気づけないため */
  function sentHere() {
    var btn = null;
    ['send', 'c_send'].forEach(function (id) { var b = document.getElementById(id); if (!btn && b && b.offsetParent) btn = b; });
    var box = document.createElement('div');
    box.className = 'sent-box';
    box.innerHTML = '<span class="sent-ck">✓</span><div><b>送信しました</b><p>このタブを閉じてください。</p></div>';
    if (btn) { btn.parentNode.insertBefore(box, btn); btn.classList.add('hide'); }
    else { var m = document.querySelector('main') || document.body; m.appendChild(box); }
    document.body.classList.add('sent');
    try { box.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { box.scrollIntoView(); }
  }
  function show(t, ok) { var m = $('msg'); m.textContent = t; m.classList.toggle('ok', !!ok); m.classList.remove('hide'); }

  /* 会社名・出張者は、出張報告のフォームと同じ置き場所に覚える */
  var PEOPLE_KEY = 'houkoku_people_v1';
  function people() {
    try {
      var o = JSON.parse(localStorage.getItem(PEOPLE_KEY) || '{}') || {};
      o.co = o.co || []; o.pe = o.pe || []; o.me = o.me || '';
      return o;
    } catch (e) { return { co: [], pe: [], me: '' }; }
  }
  function rememberPeople(cos, pes) {
    var o = people();
    cos.slice().reverse().forEach(function (n) { o.co = [n].concat(o.co.filter(function (x) { return x !== n; })); });
    pes.slice().reverse().forEach(function (n) { o.pe = [n].concat(o.pe.filter(function (x) { return x !== n; })); });
    o.co = o.co.slice(0, 12); o.pe = o.pe.slice(0, 12);
    try { localStorage.setItem(PEOPLE_KEY, JSON.stringify(o)); } catch (e) {}
  }

  function addLine(boxId, value, ph) {
    var box = $(boxId);
    var el = document.createElement('div');
    el.className = 'who';
    el.innerHTML = '<input type="text"><button type="button" class="x">×</button>';
    var inp = el.querySelector('input');
    inp.placeholder = ph; inp.value = value || '';
    el.querySelector('.x').onclick = function () { el.remove(); trim(box); };
    box.appendChild(el);
    trim(box);
    return inp;
  }
  function trim(box) {
    each(box.children, function (el) { el.querySelector('.x').classList.toggle('hide', box.children.length === 1); });
  }
  function list(boxId) {
    var out = [];
    each($(boxId).querySelectorAll('input'), function (el) { var v = val(el.value); if (v && out.indexOf(v) < 0) out.push(v); });
    return out;
  }

  /* 便 */
  function renumber() {
    var legs = $('legs').children;
    each(legs, function (w, i) {
      w.querySelector('.no').textContent = '便' + (MARU[i] || (i + 1));
      w.querySelector('.del').classList.toggle('hide', legs.length === 1);
    });
  }
  function addLeg() {
    var w = $('tpl_leg').content.firstElementChild.cloneNode(true);
    var day = w.querySelector('.day'), cls = w.querySelector('.cls'), flt = w.querySelector('.flt');
    day.onclick = function () { openCal(day); };
    cls.addEventListener('change', function () { cls.classList.toggle('empty', !cls.value); });
    flt.addEventListener('input', function () { flt.value = flt.value.toUpperCase(); });
    // 2便目以降は、前の便の座席クラスを引き継ぐ
    var prev = $('legs').lastElementChild;
    if (prev) { var pc = prev.querySelector('.cls').value; if (pc) { cls.value = pc; cls.classList.remove('empty'); } }
    w.querySelector('.del').onclick = function () { w.remove(); renumber(); };
    $('legs').appendChild(w);
    renumber();
    return w;
  }

  function jp(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return '';
    var w = ['日', '月', '火', '水', '木', '金', '土'][new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getDay()];
    return m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日（' + w + '）';
  }

  /* ---------- カレンダー（搭乗日を1日選ぶ） ---------- */
  var cal = { field: null, picked: '', cur: new Date() };
  function p2(n) { return ('0' + n).slice(-2); }
  function short(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return '';
    var w = ['日', '月', '火', '水', '木', '金', '土'][new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getDay()];
    var y = (Number(m[1]) !== new Date().getFullYear()) ? m[1] + '年' : '';
    return y + Number(m[2]) + '月' + Number(m[3]) + '日（' + w + '）';
  }
  function openCal(el) {
    cal.field = el;
    cal.picked = el.getAttribute('data-iso') || '';
    var base = cal.picked ? new Date(cal.picked + 'T00:00:00') : new Date();
    cal.cur = new Date(base.getFullYear(), base.getMonth(), 1);
    drawCal();
    $('cal').classList.remove('hide');
  }
  function drawCal() {
    var y = cal.cur.getFullYear(), mo = cal.cur.getMonth();
    $('cal_title').textContent = y + '年' + (mo + 1) + '月';
    var head = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
    var t = new Date(), today = t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate());
    var g = $('cal_g'); g.innerHTML = '';
    for (var i = 0; i < head; i++) { var b = document.createElement('div'); b.className = 'cd empty'; g.appendChild(b); }
    for (var d = 1; d <= last; d++) {
      var iso = y + '-' + p2(mo + 1) + '-' + p2(d);
      var c = document.createElement('div');
      c.className = 'cd' + (iso < today ? ' past' : '') + (cal.picked === iso ? ' on' : '');
      c.textContent = d;
      c.setAttribute('data-iso', iso);
      c.onclick = function () { cal.picked = this.getAttribute('data-iso'); drawCal(); };
      g.appendChild(c);
    }
    $('cal_sel').innerHTML = cal.picked ? '<b>' + short(cal.picked) + '</b>' : '搭乗日を選んでください';
    $('cal_ok').disabled = !cal.picked;
  }
  function setupCal() {
    $('cal_prev').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() - 1); drawCal(); };
    $('cal_next').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() + 1); drawCal(); };
    $('cal_cancel').onclick = function () { $('cal').classList.add('hide'); };
    $('cal').onclick = function (e) { if (e.target === $('cal')) $('cal').classList.add('hide'); };
    $('cal_ok').onclick = function () {
      if (!cal.picked) return;
      var el = cal.field;
      el.setAttribute('data-iso', cal.picked);
      el.textContent = short(cal.picked);
      el.classList.remove('empty', 'bad');
      $('cal').classList.add('hide');
    };
  }

  /* 送る文を作る。足りない欄は赤枠で止める */
  function build() {
    each(document.querySelectorAll('.bad'), function (el) { el.classList.remove('bad'); });
    var cos = list('cos'), pes = list('pes');
    if (!cos.length) { $('cos').querySelector('input').classList.add('bad'); return { err: '会社名を入れてください。' }; }
    if (!pes.length) { $('pes').querySelector('input').classList.add('bad'); return { err: '出張者を入れてください。' }; }
    var legs = [], miss = null;
    each($('legs').children, function (w) {
      var d = w.querySelector('.day'), f = w.querySelector('.flt'), c = w.querySelector('.cls');
      var a = w.querySelector('.from'), t = w.querySelector('.to');
      [[d, d.getAttribute('data-iso')], [f, val(f.value)], [a, val(a.value)], [t, val(t.value)], [c, c.value]].forEach(function (p) { if (!p[1]) { p[0].classList.add('bad'); miss = miss || p[0]; } });
      legs.push(jp(d.getAttribute('data-iso')) + '　' + val(f.value).replace(/\s+/g, '') + '　' + val(a.value) + '→' + val(t.value) + '　' + c.value);
    });
    if (miss) { try { miss.focus(); } catch (e) {} return { err: '搭乗日・便名・出発地・到着地・座席クラスをすべて入れてください。' }; }
    var L = ['【国際線見積り依頼】'];
    L.push('会社名：' + cos.join('／'));
    L.push('出張者：' + pes.join('／'));
    L.push('便：');
    legs.forEach(function (x) { L.push('・' + x); });
    return { text: L.join('\n'), cos: cos, pes: pes };
  }

  function start() {
    setupCal();
    var pp = people();
    addLine('cos', pp.co[0] || '', '会社名');
    addLine('pes', pp.pe[0] || myName || pp.me || '', '氏名');
    addLeg();
    $('addleg').onclick = function () { var w = addLeg(); w.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    document.addEventListener('input', function (e) { $('err').textContent = ''; if (e.target.classList) e.target.classList.remove('bad'); });
    document.addEventListener('change', function (e) { $('err').textContent = ''; if (e.target.classList) e.target.classList.remove('bad'); });

    var reqId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    $('send').onclick = function () {
      var b = build();
      if (b.err) { $('err').textContent = b.err; return; }
      rememberPeople(b.cos, b.pes);
      if (PREVIEW) { console.log(b.text); show('プレビューのため送信していません。'); return; }
      $('send').disabled = true;
      $('send').textContent = '送信中…';
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'mitsu', id: reqId, accessToken: liff.getAccessToken(), text: b.text,
                               ch: (new URLSearchParams(location.search).get('ch') || '') })
      })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.ok) throw new Error((j && j.error) || 'error');
          if (IN_LINE) { try { liff.closeWindow(); return; } catch (e) {} }
          sentHere();
        })
        .catch(function (e) {
          $('send').disabled = false;
          $('send').textContent = '依頼を送る';
          show('送信できませんでした。もう一度お試しください。（' + e.message + '）');
        });
    };
    $('form').classList.remove('hide');
  }

  if (PREVIEW) { start(); return; }
  liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true }).then(function () {
    try { IN_LINE = !!liff.isInClient(); } catch (e) { IN_LINE = false; }
    if (!IN_LINE && !liff.isLoggedIn()) { liff.login(); return; }
    liff.getProfile()
      .then(function (p) { myName = p.displayName || ''; })
      .catch(function () {})
      .then(start);
  }).catch(function (e) { show('起動に失敗しました。（' + e + '）'); });
})();
</script>
</body>
</html>
